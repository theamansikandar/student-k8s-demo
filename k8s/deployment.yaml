apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-k8s-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-k8s-demo

  template:
    metadata:
      labels:
        app: student-k8s-demo

    spec:
      containers:
        - name: student-k8s-demo
          image: theamansikandar/student-k8s-demo:REPLACE_WITH_COMMIT_SHA
          ports:
            - containerPort: 5001

          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5